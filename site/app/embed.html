<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Predictor forecast card</title>
  <meta name="robots" content="noindex">
  <!-- A small card for one sealed forecast, made to sit inside an <iframe> on any web page:
       embed.html#gold (add ?theme=light or ?theme=dark to fix the colours). Reads the same data.js as the app. -->
  <style>
    :root { --bg: #272c48; --panel: #30365a; --ink: #f4f5fc; --ink-2: #c6cbe6; --line: #464e7a; --tfm: #93b6ff; --band: rgba(147,182,255,.28);
      --up: #52ef9d; --down: #ff929e; --seal: #d9413f; color-scheme: dark; }
    :root[data-theme="light"] { --bg: #e6e8f6; --panel: #f1f2fb; --ink: #14172e; --ink-2: #3b4064; --line: #c8cce6; --tfm: #2a45c4; --band: rgba(42,69,196,.18);
      --up: #0f6a3e; --down: #a3172f; --seal: #b0232b; color-scheme: light; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #e6e8f6; --panel: #f1f2fb; --ink: #14172e; --ink-2: #3b4064; --line: #c8cce6;
      --tfm: #2a45c4; --band: rgba(42,69,196,.18); --up: #0f6a3e; --down: #a3172f; --seal: #b0232b; color-scheme: light; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { height: 100%; padding: 14px 16px 12px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; min-height: 220px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; color: var(--ink-2); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 18px; line-height: 1.25; }
    .main { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; min-height: 0; }
    .p { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .p.up { color: var(--up); } .p.down { color: var(--down); }
    .p small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 4px; max-width: 13ch; }
    .chart { position: relative; width: 100%; height: 100%; min-height: 90px; }
    .chart svg { position: absolute; inset: 0; display: block; }
    .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
    .foot b { color: var(--ink); font-weight: 600; }
    a { color: var(--tfm); }
    a:focus-visible { outline: 2px solid var(--tfm); outline-offset: 2px; }
    .empty { padding: 20px; color: var(--ink-2); }
  </style>
  <script>try { const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main id="card" class="card" aria-live="polite"></main>
<script src="data/data.js"></script>
<script>
(function () {
  const D = window.WP_DATA || {};
  const host = document.getElementById("card");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (p) => (p < 0.01 ? "<1%" : p > 0.99 ? ">99%" : Math.round(p * 100) + "%");
  const sp = (v) => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + "%";
  const day = (s) => new Date(String(s).slice(0, 10) + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const app = "index.html";

  function render() {
    const want = decodeURIComponent(location.hash.slice(1));
    const all = D.outlook || [];
    const o = all.find((x) => x.id === want) || all[0];
    if (!o) { host.innerHTML = `<p class="empty">No sealed forecast yet. <a href="${app}" target="_top">Open World Predictor</a></p>`; return; }
    const model = /^timesfm/.test((D.meta || {}).model || "") ? "TimesFM" : ((D.meta || {}).model || "the model");
    const cls = o.p_up >= 0.55 ? "up" : o.p_up <= 0.45 ? "down" : "";
    document.title = `${o.title}: ${pct(o.p_up)} chance higher by ${day(o.target_date)}`;
    host.innerHTML = `
      <div class="top"><span>World Predictor${D.meta && D.meta.demo ? " · demo data" : ""}</span><span>Sealed ${esc(day(o.made_on))}</span></div>
      <h1>${esc(o.title)}</h1>
      <div class="main">
        <div class="p ${cls}">${pct(o.p_up)}<small>chance it ends higher by ${esc(day(o.target_date))}</small></div>
        <div class="chart" id="chart"></div>
      </div>
      <div class="foot"><span>Middle <b>${sp(o.change)}</b> · 80% range <b>${sp(o.low)}</b> to <b>${sp(o.high)}</b> · ${esc(model)}</span>
        <a href="${app}#series/${encodeURIComponent(o.id)}" target="_top">How it is scored</a></div>`;
    draw(o);
  }

  let shown = null;
  function draw(o) {
    shown = o || shown; const slot = document.getElementById("chart"); if (!slot || !shown) return;
    slot.innerHTML = chart(shown, Math.max(120, slot.clientWidth), Math.max(80, slot.clientHeight));
  }

  // Two months of history in ink, the 80% fan ahead in the forecast colour, the sealing day as a red dot.
  function chart(o, W, H) {
    const hist = (o.history || []).slice(-42), fan = o.fan || [];
    const t = (s) => Date.parse(String(s).slice(0, 10));
    const pts = hist.map(([d, v]) => [t(d), v]).concat(fan.flatMap(([d, a, , b]) => [[t(d), a], [t(d), b]]));
    if (pts.length < 2) return "<span></span>";
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const ta = Math.min(...xs), tb = Math.max(...xs), va = Math.min(...ys), vb = Math.max(...ys), pad = (vb - va) * 0.08 || 1;
    const sx = (v) => (4 + (W - 8) * (v - ta) / Math.max(1, tb - ta)).toFixed(1), sy = (v) => (H - 4 - (H - 8) * (v - va + pad) / (vb - va + 2 * pad)).toFixed(1);
    const line = (arr) => arr.map(([x, y], i) => (i ? "L" : "M") + sx(x) + " " + sy(y)).join("");
    const band = fan.length ? line(fan.map(([d, a]) => [t(d), a])) + fan.slice().reverse().map(([d, , , b]) => "L" + sx(t(d)) + " " + sy(b)).join("") + "Z" : "";
    const last = hist[hist.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Recent history and the 80% forecast range ahead">
      ${band ? `<path d="${band}" fill="var(--band)"/>` : ""}
      ${fan.length ? `<path d="${line(fan.map(([d, , m]) => [t(d), m]))}" fill="none" stroke="var(--tfm)" stroke-width="2" stroke-dasharray="5 4"/>` : ""}
      <path d="${line(hist.map(([d, v]) => [t(d), v]))}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      ${last ? `<circle cx="${sx(t(last[0]))}" cy="${sy(last[1])}" r="3.5" fill="var(--seal)"/>` : ""}
    </svg>`;
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("resize", () => draw());
  render();
})();
</script>
</body>
</html>
