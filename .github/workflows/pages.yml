name: pages

# Publishes the World Predictor web app (site/) to GitHub Pages:
#   https://normansrule.github.io/world-predictor/
# The app reads results/web/data.js, which the weekly predict workflow refreshes. Until the first
# forecast run, the demo data in site/app/data/data.js is used.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  workflow_run:
    workflows: [predict]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "results/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          if [ -f results/web/data.js ]; then cp results/web/data.js _site/app/data/data.js; fi
          mkdir -p _site/results
          cp -r results/plots _site/results/ 2>/dev/null || true
          cp results/REPORT.md results/dashboard.html _site/results/ 2>/dev/null || true
          # Bump the offline cache name so returning visitors get the new version.
          sed -i "s/world-predictor-v1/world-predictor-${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
