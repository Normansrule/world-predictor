name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[classical,dev]"
      - run: pytest -q
      - name: The app's JavaScript parses
        if: matrix.python-version == '3.12'
        run: for f in site/app/js/*.js site/assets/site.js site/sw.js; do node --check "$f"; done
