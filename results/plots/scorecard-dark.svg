<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-label="Scoreboard: how timesfm-2.5 did in each domain">
<style>
  .bg { fill: #060a16; }
  .card { fill: none; stroke: #1d2944; stroke-width: 1.5; }
  .title { font: 600 15px Inter, system-ui, sans-serif; fill: #9aa6bc; letter-spacing: .06em; }
  .name { font: 600 18px Inter, system-ui, sans-serif; fill: #f2ede3; }
  .big { font: 700 52px Inter, system-ui, sans-serif; }
  .cap { font: 400 14px Inter, system-ui, sans-serif; fill: #9aa6bc; }
  .k { font: 400 14px Inter, system-ui, sans-serif; fill: #9aa6bc; }
  .v { font: 600 14px Inter, system-ui, sans-serif; fill: #f2ede3; }
  .foot { font: 400 12px Inter, system-ui, sans-serif; fill: #9aa6bc; }
</style>
<rect class="bg" width="1200" height="310" rx="16"/>
<text x="40" y="42" class="title">SCOREBOARD  ·  TIMESFM-2.5  VS  "TOMORROW LOOKS LIKE TODAY"</text>

<g transform="translate(40,0)">
  <rect x="0" y="62" width="350" height="208" rx="12" class="card"/>
  <text x="22" y="98" class="name">📰  World news</text>
  <text x="22" y="160" class="big" style="fill:#5fd4e6">+12%</text>
  <text x="22" y="186" class="cap">less error than the simple guess</text>
  <text x="22" y="222" class="k">Sees ahead</text><text x="328" y="222" class="v" text-anchor="end">about 28 days</text>
  <text x="22" y="250" class="k">Right direction</text><text x="328" y="250" class="v" text-anchor="end">67% of the time</text>
</g>
<g transform="translate(420,0)">
