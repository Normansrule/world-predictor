  <text x="22" y="160" class="big" style="fill:#9aa6bc">+1%</text>
  <text x="22" y="186" class="cap">about the same error as the simple guess</text>
  <text x="22" y="222" class="k">Sees ahead</text><text x="328" y="222" class="v" text-anchor="end">no edge at any distance</text>
  <text x="22" y="250" class="k">Right direction</text><text x="328" y="250" class="v" text-anchor="end">52% of the time</text>
</g>
<g transform="translate(800,0)">
  <rect x="0" y="62" width="350" height="208" rx="12" class="card"/>
  <text x="22" y="98" class="name">🚀  Technology</text>
  <text x="22" y="160" class="big" style="fill:#5fd4e6">+43%</text>
  <text x="22" y="186" class="cap">less error than the simple guess</text>
  <text x="22" y="222" class="k">Sees ahead</text><text x="328" y="222" class="v" text-anchor="end">about 28 days</text>
  <text x="22" y="250" class="k">Right direction</text><text x="328" y="250" class="v" text-anchor="end">77% of the time</text>
</g>
<text x="40" y="296" class="foot">Updated 2026-10-19 · 300 backtest forecasts scored · refreshed every week</text>
</svg>
