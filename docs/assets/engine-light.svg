GDELT news attention, Yahoo Finance prices,</text><text x="679.794383437009" y="188" font-size="12.5" fill="#4f5a70">Wikipedia pageviews and Our World in Data.</text><line x1="596" y1="268" x2="641.794383437009" y2="268" stroke="#4f5a70" stroke-width="1" stroke-dasharray="2 4"/><circle cx="655.794383437009" cy="268" r="13" fill="#f4f6fb" stroke="#0a7c93" stroke-width="1.5"/><text x="655.794383437009" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7c93">2</text><text x="679.794383437009" y="264" font-size="18" font-weight="700" fill="#0d1424" font-family="Fraunces, Georgia, serif">History</text><text x="679.794383437009" y="284" font-size="12.5" fill="#4f5a70">Years of daily or weekly values for one</text><text x="679.794383437009" y="300" font-size="12.5" fill="#4f5a70">series: the past the model is allowed to see.</text><line x1="596" y1="380" x2="641.794383437009" y2="380" stroke="#4f5a70" stroke-width="1" stroke-dasharray="2 4"/><circle cx="655.794383437009" cy="380" r="13" fill="#f4f6fb" stroke="#0a7c93" stroke-width="1.5"/><text x="655.794383437009" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7c93">3</text><text x="679.794383437009" y="376" font-size="18" font-weight="700" fill="#0d1424" font-family="Fraunces, Georgia, serif">Context window</text><text x="679.794383437009" y="396" font-size="12.5" fill="#4f5a70">TimesFM reads the history in patches of 32</text><text x="679.794383437009" y="412" font-size="12.5" fill="#4f5a70">steps, like words in a sentence.</text><line x1="596" y1="492" x2="641.794383437009" y2="492" stroke="#4f5a70" stroke-width="1" stroke-dasharray="2 4"/><circle cx="655.794383437009" cy="492" r="13" fill="#f4f6fb" stroke="#0a7c93" stroke-width="1.5"/><text x="655.794383437009" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7c93">4</text><text x="679.794383437009" y="488" font-size="18" font-weight="700" fill="#0d1424" font-family="Fraunces, Georgia, serif">TimesFM 2.5</text><text x="679.794383437009" y="508" font-size="12.5" fill="#4f5a70">Google Research&#x27;s open forecasting model.</text><text x="679.794383437009" y="524" font-size="12.5" fill="#4f5a70">Nothing is trained on our data.</text><line x1="596" y1="604" x2="641.794383437009" y2="604" stroke="#4f5a70" stroke-width="1" stroke-dasharray="2 4"/><circle cx="655.794383437009" cy="604" r="13" fill="#f4f6fb" stroke="#0a7c93" stroke-width="1.5"/><text x="655.794383437009" y="609" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7c93">5</text><text x="679.794383437009" y="600" font-size="18" font-weight="700" fill="#0d1424" font-family="Fraunces, Georgia, serif">Forecast</text><text x="679.794383437009" y="620" font-size="12.5" fill="#4f5a70">A range for every step ahead: the middle guess</text><text x="679.794383437009" y="636" font-size="12.5" fill="#4f5a70">and an 80% band, sealed with a date.</text><line x1="596" y1="716" x2="641.794383437009" y2="716" stroke="#4f5a70" stroke-width="1" stroke-dasharray="2 4"/><circle cx="655.794383437009" cy="716" r="13" fill="#f4f6fb" stroke="#0a7c93" stroke-width="1.5"/><text x="655.794383437009" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#0a7c93">6</text><text x="679.794383437009" y="712" font-size="18" font-weight="700" fill="#0d1424" font-family="Fraunces, Georgia, serif">Score</text><text x="679.794383437009" y="732" font-size="12.5" fill="#4f5a70">When the future arrives, reality is drawn over</text><text x="679.794383437009" y="748" font-size="12.5" fill="#4f5a70">the fan and the forecast is scored.</text></svg>